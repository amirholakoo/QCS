<section class="section_page" id="material_create_form">
    <div class="page_title">
        <div class="title">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package w-5 h-5 text-indigo-600"><path d="m7.5 4.27 9 5.15"></path><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>
            </div>
            <div class="text">
                <h5>
                    افزودن مواد
                </h5>
                <p>اطلاعات ماده را به دقت وارید</p>
            </div>
        </div>
        <a href="#setting#material_dashboard" class="back_btn btn btn-danger">
            بازگشت
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        </a>
    </div>
    <div class="flow_sections_title">
        <div class="title active" section_target="material_section_1" style="--percentage: 0%;max-width: 200px;" percentage="0%">اطلاعات ماده<hr></div>
    </div>
    <form class="form" action="{% url 'add_new_material' %}" next="#setting#material_dashboard">
        <div class="form_section active" id="material_section_1">
            <div class="form_header">
                <div class="title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package w-5 h-5 text-indigo-600"><path d="m7.5 4.27 9 5.15"></path><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>
                    <h6>اطلاعات ماده</h6>
                </div>
            </div>
            <div class="form_body" style="grid-template-columns: auto;justify-content: center;gap: 10px;">
                <div class="form_group">
                    <input id="Material_Form_Name" name="Material_Form_Name" type="text" placeholder="مثال: AKD" required>
                    <label for="Material_Form_Name">نام ماده</label>
                </div>
                <div class="form_group">
                    <textarea id="Material_Form_Desc" name="Material_Form_Desc" placeholder="مثال: تزریق به داخل حوض"></textarea>
                    <label for="Material_Form_Desc">توضیحات</label>
                </div>
                <div class="form_group check-box">
                    <input id="Material_Form_Active" name="Material_Form_Active" type="checkbox" checked step="0.01" placeholder="مثال: 178">
                    <label for="Material_Form_Active">فعال است؟</label>
                    <p class="help_text">فقط مواد فعال در فرم افزودن کاغذ نمایش داده میشود</p>
                </div>
            </div>
            <div class="text-center d-flex justify-content-center">
                <a href="#material_dashboard" class="btn btn-secondary ml-2">انصراف</a>
                <button class="next_btn btn btn-success" style="width: auto;">
                    ثبت اطلاعات
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-save w-4 h-4 ml-2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                </button>
            </div>
        </div>
    </form>
</section>
