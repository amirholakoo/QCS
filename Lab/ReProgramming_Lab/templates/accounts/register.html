{% extends "base/base.html" %}
{% load static %}
{% block Link %}
<link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
{% endblock %}
{% block header %}{% endblock %}
{% block content %}


<section class="login" id="login">
    <div>
        <div class="login_header">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-plus w-5 h-5 text-white"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg>
            </div>
            <h5>
                سیستم مدیریت تولید کاغذ
            </h5>
        </div>
        <div class="login_card">
            <div class="login_card_header">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user w-4 h-10 text-primary-600"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <p>نام و نام خانوادگی خود را وارد کنید <b></b></p>
            </div>
            <form class="form_section" action="" method="post">
                {% csrf_token %}
                <div class="login_body">
                        <div class="form_group">
                            <input id="user_name" name="user_name" type="text" placeholder="مثال: امیر" required>
                            <label for="user_name">نام</label>
                        </div>
                        <div class="form_group">
                            <input id="user_familly" name="user_familly" type="text" placeholder="مثال: موسوی" required>
                            <label for="user_familly">نام خانوادگی</label>
                        </div>
                </div>
                <div style="padding: 0 10px;">
                    <button type="submit">ثبت نام</button>
                </div>
            </form>
        </div>
        <a href="{% url 'login' %}">از قبل حساب دارید؟ وارد شوید</a>
    </div>
</section>

{% block URL_HASH %}{% endblock %}
{% endblock %}
